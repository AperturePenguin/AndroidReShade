[versions]
agp = "8.4.0"
kotlin = "1.9.24"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
lifecycle = "2.8.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx:1.13.1" }
androidx-appcompat = { module = "androidx.appcompat:appcompat:1.7.0" }
material = { module = "com.google.android.material:material:1.12.0" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout:2.1.4" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx:2.8.0" }
junit = { module = "junit:junit:4.13.2" }
androidx-junit = { module = "androidx.test.ext:junit:1.2.1" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core:3.6.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
